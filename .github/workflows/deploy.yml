# Deploys to the VPS. Never runs on pull requests or branches: only after the test workflow
# passes on a push to main, or by hand ("Run workflow") to redeploy main.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions). Run
# deploy/setup-ci.sh on the server to get the values.
#   VPS_HOST         server IP
#   VPS_USER         SSH user (e.g. root)
#   VPS_SSH_KEY      private key whose public half is in the server's ~/.ssh/authorized_keys
#   VPS_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <VPS_HOST>   (pins the server's identity)
name: deploy

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cut a deploy off halfway

jobs:
  deploy:
    # Only a successful test run of a push to main (not a PR whose branch is called main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pick the commit
        id: target
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
          MANUAL: ${{ github.sha }}
        run: echo "sha=${TESTED:-$MANUAL}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          SHA: ${{ steps.target.outputs.sha }}
        # The script comes from the commit being deployed, so a fix to deploy.sh applies at once.
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit id"; exit 1; }
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$USER@$HOST" "TARGET=$SHA bash -s" < deploy/deploy.sh
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
