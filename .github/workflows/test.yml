# Tests only: every push to any branch and every pull request. No secrets, no server access.
# A pass on main is what starts deploy.yml.
name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true # a newer push makes the older run pointless

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sidecar tests (fallback mode, no model download)
        run: |
          pip install --quiet fastapi uvicorn pydantic httpx
          python -m unittest sidecar.test_laya_service
