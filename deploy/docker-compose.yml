# Usage (on the VPS, from the repo root):
#   cp deploy/.env.example deploy/.env   # then set DOMAIN
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  azaman:
    build: ..
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Laya with one checkpoint sits at ~1.9GB idle; 3g leaves room for inference. With LAYA_DISABLE=1, 512m is plenty.
    mem_limit: ${AZAMAN_MEM_LIMIT:-3g}
    environment:
      # Optional: 1 turns the Laya AI sidecar off (rules only, ~1.8GB less RAM)
      LAYA_DISABLE: ${LAYA_DISABLE:-}
      # Same long random value as GRADE_PROOF_SECRET on the landing site; lets it sign share links
      GRADE_PROOF_SECRET: ${GRADE_PROOF_SECRET:-}
      # Only these origins may call the API from a browser (the dashboard itself is same-origin)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAIN:?set DOMAIN in deploy/.env}}
      # Optional: turns on GET /api/v1/stats (counts only) for "Authorization: Bearer <token>"
      STATS_TOKEN: ${STATS_TOKEN:-}
    expose:
      - "8080"          # reachable by Caddy only; no host port published

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - azaman
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      LENS_DOMAIN: ${LENS_DOMAIN:-lens.taxcafe.pro}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # TLS certificates (persist across restarts)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
